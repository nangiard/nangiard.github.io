<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>NAN GIARD</title>

  <link href="https://fonts.googleapis.com/css2?family=Lato:wght@400&display=swap" rel="stylesheet">

  <style>
    :root {
      --accent: #fad410;
  }
    
  body {
    font-family: 'Lato', Arial, sans-serif;
    background: #fff;
    color: #333;
    margin: 0;
  }

  header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 10px 20px;
  }

  .left {
    display: flex;
    align-items: center;
    gap: 30px;
  }

  header img {
    height: 80px;
  }

  .menu a {
    text-decoration: none;
    color: #818589;
    font-size: 16px;
    margin-right: 20px;
    transition: opacity 0.2s;
  }

  .menu a:hover {
    opacity: 0.8;
    color: var(--accent);
  }

    .menu a.active {
  color: var(--accent);
  opacity: 0.8;
}

  .contact {
    font-size: 16px;
  }

  .gallery {
    display: flex;
    flex-wrap: wrap;
    gap: 1px;
    justify-content: center;
  }

 .gallery img {
      max-height: 370px;
      border-radius: 10px;
      object-fit: contain;
      cursor: pointer;
      transition: transform 0.3s;
    }

    .gallery img:hover {
      transform: scale(1.01);
    }

    .lightbox {
      display: none;
      position: fixed;
      z-index: 1000;
      left: 0;
      top: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.9);
      justify-content: center;
      align-items: center;
    }

    .lightbox img {
      max-width: 90%;
      max-height: 90%;
      display: block;
    }
    #lightbox-caption {
      position: absolute;
      bottom: 40px;
      left: 50%;
      transform: translateX(-50%);

      background: rgba(0, 0, 0, 0.6);
      color: #fff;
      padding: 10px 16px;
      border-radius: 6px;

      font-size: 14px;
      text-align: center;
      pointer-events: none;
    }
    #lightbox span {
      position: absolute;
      color: #fff;
      font-size: 40px;
      font-weight: bold;
      cursor: pointer;
      user-select: none;
    }

    #close { top: 10px; right: 20px; }
    #prev { top: 50%; left: 25px; transform: translateY(-50%); }
    #next { top: 50%; right: 25px; transform: translateY(-50%); }

</style>
</head>

<body>

<header>
  <div class="left">
    <img src="logo.png" alt="Logo">

    <nav class="menu">
      <a href="/">About</a>
      <a href="fashion.html">Fashion/Editorial</a>
      <a href="advertising.html" class="active">Advertising</a>
    </nav>
  </div>

  <div class="contact">
    info@nangiard.com | +372 5394 1527
  </div>
</header>

<div class="gallery" id="gallery"></div>

<div id="lightbox" class="lightbox">
  <span id="close" onclick="closeLightbox()">×</span>
  <span id="prev" onclick="changePhoto(-1)">&#10094;</span>
  <img id="lightbox-img">
  <div id="lightbox-caption"></div>
  <span id="next" onclick="changePhoto(1)">&#10095;</span>
</div>

<script>
const gallery = document.getElementById('gallery');
const galleryImgs = [];

// 🎯 MANUAL PHOTO DATA
const photos = [
  {
    low: "Advertising/L_Advert(1).jpg",
    high: "Advertising/H_Advert(1).jpg",
    caption: "Guess Smart Luxury | 2017"
  },
  {
    low: "Advertising/L_Advert(2).jpg",
    high: "Advertising/H_Advert(2).jpg",
    caption: "Guess Smart Luxury | 2016"
  },
  {
    low: "Advertising/L_Advert(3).jpg",
    high: "Advertising/H_Advert(3).jpg",
    caption: "HBO | 2021"
  },
  {
    low: "Advertising/L_Advert(4).jpg",
    high: "Advertising/H_Advert(4).jpg",
    caption: "BioRitmo | 2017"
  },
  {
    low: "Advertising/L_Advert(5).jpg",
    high: "Advertising/H_Advert(5).jpg",
    caption: "BioRitmo | 2017"
  },
  {
    low: "Advertising/L_Advert(6).jpg",
    high: "Advertising/H_Advert(6).jpg",
    caption: "Nós | 2018"
  },
  {
    low: "Advertising/L_Advert(7).jpg",
    high: "Advertising/H_Advert(7).jpg",
    caption: "Nike | 2015"
  },
  {
    low: "Advertising/L_Advert(8).jpg",
    high: "Advertising/H_Advert(8).jpg",
    caption: "Nike | 2015"
  },
  {
    low: "Advertising/L_Advert(9).jpg",
    high: "Advertising/H_Advert(9).jpg",
    caption: "AVON | 2015"
  },
  {
    low: "Advertising/L_Advert(10).jpg",
    high: "Advertising/H_Advert(10).jpg",
    caption: "AVON | 2015"
  },
  {
    low: "Advertising/L_Advert(11).jpg",
    high: "Advertising/H_Advert(11).jpg",
    caption: "Domino's Pizza | 2015"
  }
];

// 🖼️ BUILD GALLERY
photos.forEach((photo) => {
  const img = document.createElement('img');

  img.src = photo.low;
  img.setAttribute('data-highres', photo.high);
  img.setAttribute('data-caption', photo.caption);

  img.onclick = function () {
    openLightbox(this);
  };

  gallery.appendChild(img);
  galleryImgs.push(img);
});

let currentIndex = 0;

// 🔍 OPEN LIGHTBOX
function openLightbox(img) {
  document.getElementById('lightbox').style.display = 'flex';

  currentIndex = galleryImgs.indexOf(img);

  document.getElementById('lightbox-img').src =
    img.getAttribute('data-highres');

  document.getElementById('lightbox-caption').textContent =
    img.getAttribute('data-caption');
}

// ❌ CLOSE LIGHTBOX
function closeLightbox() {
  document.getElementById('lightbox').style.display = 'none';
}

// ⬅️➡️ NAVIGATE
function changePhoto(direction) {
  currentIndex =
    (currentIndex + direction + galleryImgs.length) % galleryImgs.length;

  const currentImg = galleryImgs[currentIndex];

  document.getElementById('lightbox-img').src =
    currentImg.getAttribute('data-highres');

  document.getElementById('lightbox-caption').textContent =
    currentImg.getAttribute('data-caption');
}
</script>
