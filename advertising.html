<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>NAN GIARD</title>

  <link href="https://fonts.googleapis.com/css2?family=Lato:wght@400&display=swap" rel="stylesheet">

  <style>
    :root {
      --accent: #fad410;
  }
    
  body {
    font-family: 'Lato', Arial, sans-serif;
    background: #fff;
    color: #333;
    margin: 0;
  }

  header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 10px 20px;
  }

  .left {
    display: flex;
    align-items: center;
    gap: 30px;
  }

  header img {
    height: 80px;
  }

  .menu a {
    text-decoration: none;
    color: #818589;
    font-size: 16px;
    margin-right: 20px;
    transition: opacity 0.2s;
  }

  .menu a:hover {
    opacity: 0.8;
    color: var(--accent);
  }

    .menu a.active {
  color: var(--accent);
  opacity: 0.8;
}

  .contact {
    font-size: 16px;
  }

  .gallery {
    display: flex;
    flex-wrap: wrap;
    gap: 1px;
    justify-content: center;
  }

  /* ✅ WRAPPER (this is what fixes overlay positioning) */
  .img-wrap {
    position: relative;
    display: inline-block;
    overflow: hidden;
    border-radius: 10px;
  }

  .img-wrap img {
    max-height: 370px;
    border-radius: 10px;
    object-fit: contain;
    cursor: pointer;
    transition: transform 0.3s ease;
    display: block;
  }

  .img-wrap:hover img {
    transform: scale(1.03);
  }

  /* ✅ OVERLAY ON TOP OF IMAGE */
  .overlay {
    position: absolute;
    inset: 0;
    background: rgba(250, 212, 16, 0.8);
    color: #FFFFFF;
    font-family: 'Lato', Arial, sans-serif;
    font-weight: bold;
    text-shadow: 0 0 3px rgba(0,0,0,0.8);
    display: flex;
    align-items: center;
    justify-content: center;
    opacity: 0;
    transition: 0.25s ease;
    pointer-events: none;
    font-size: 17px;
  }

  .img-wrap:hover .overlay {
    background: rgba(200, 200, 200, 0.6);
    opacity: 1;
  }

  .lightbox {
    display: none;
    position: fixed;
    z-index: 1000;
    left: 0;
    top: 0;
    width: 100%;
    height: 100%;
    background: rgba(0,0,0,0.9);
    justify-content: center;
    align-items: center;
  }

  .lightbox img {
    max-width: 90%;
    max-height: 90%;
  }

  #lightbox span {
    position: absolute;
    color: #fff;
    font-size: 40px;
    font-weight: bold;
    cursor: pointer;
    user-select: none;
  }

  #close { top: 10px; right: 20px; }
  #prev { top: 50%; left: 25px; transform: translateY(-50%); }
  #next { top: 50%; right: 25px; transform: translateY(-50%); }

</style>
</head>

<body>

<header>
  <div class="left">
    <img src="logo.png" alt="Logo">

    <nav class="menu">
      <a href="/">About</a>
      <a href="fashion.html">Fashion/Editorial</a>
      <a href="advertising.html" class="active">Advertising</a>
    </nav>
  </div>

  <div class="contact">
    info@nangiard.com | +372 5394 1527
  </div>
</header>

<div class="gallery" id="gallery"></div>

<div id="lightbox" class="lightbox">
  <span id="close" onclick="closeLightbox()">×</span>
  <span id="prev" onclick="changePhoto(-1)">&#10094;</span>
  <img id="lightbox-img">
  <span id="next" onclick="changePhoto(1)">&#10095;</span>
</div>

<script>
const gallery = document.getElementById('gallery');
const galleryImgs = [];

// 👇 Add your photos here
const photos = [
  {
    low: "Advertising/L_Advert(1).jpg",
    high: "Advertising/H_Advert(1).jpg",
    label: "Guess Smart Luxury",
    year: "2017"
  },
  {
    low: "Advertising/L_Advert(2).jpg",
    high: "Advertising/H_Advert(2).jpg",
    label: "Guess Smart Luxury",
    year: "2016"
  },
  {
    low: "Advertising/L_Advert(3).jpg",
    high: "Advertising/H_Advert(3).jpg",
    label: "HBO",
    year: "2021"
  },
   {
    low: "Advertising/L_Advert(4).jpg",
    high: "Advertising/H_Advert(4).jpg",
    label: "BioRitmo",
    year: "2017"
  },
   {
    low: "Advertising/L_Advert(5).jpg",
    high: "Advertising/H_Advert(5).jpg",
    label: "BioRitmo",
    year: "2017"
  },
   {
    low: "Advertising/L_Advert(6).jpg",
    high: "Advertising/H_Advert(6).jpg",
    label: "Nós",
    year: "2018"
  },
   {
    low: "Advertising/L_Advert(7).jpg",
    high: "Advertising/H_Advert(7).jpg",
    label: "Domino's",
    year: "2017"
  }
];

photos.forEach((photo) => {
  const wrapper = document.createElement('div');
  wrapper.classList.add('img-wrap');

  const img = document.createElement('img');

  img.src = photo.low;
  img.setAttribute('data-highres', photo.high);

  img.onclick = function () {
    openLightbox(this);
  };

  const overlay = document.createElement('div');
  overlay.classList.add('overlay');
  overlay.innerText = photo.label;
  overlay.innerText = `${photo.label} - ${photo.year}`;

  wrapper.appendChild(img);
  wrapper.appendChild(overlay);

  gallery.appendChild(wrapper);
  galleryImgs.push(img);
});

  let currentIndex = 0;

  function openLightbox(img) {
    document.getElementById('lightbox').style.display = 'flex';
    currentIndex = galleryImgs.indexOf(img);
    document.getElementById('lightbox-img').src = img.getAttribute('data-highres');
  }

  function closeLightbox() {
    document.getElementById('lightbox').style.display = 'none';
  }

  function changePhoto(direction) {
    currentIndex = (currentIndex + direction + galleryImgs.length) % galleryImgs.length;
    document.getElementById('lightbox-img').src = galleryImgs[currentIndex].getAttribute('data-highres');
  }
</script>

</body>
</html>
